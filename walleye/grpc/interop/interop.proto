syntax = "proto3";

package walleye.interop;

option java_package = "walleye.interop";
option java_multiple_files = true;

message SimpleRequest {
  string text = 1;
  int32 n = 2;
}

message SimpleResponse {
  string text = 1;
  int32 n = 2;
}

message StreamRequest {
  int32 count = 1;
  int32 size = 2;
  string text = 3;
}

message MetadataRequest {
  string key = 1;
  string value = 2;
}

service TestService {
  rpc Unary(SimpleRequest) returns (SimpleResponse);
  rpc Fail(SimpleRequest) returns (SimpleResponse);
  rpc Slow(SimpleRequest) returns (SimpleResponse);
  rpc ServerStream(StreamRequest) returns (stream SimpleResponse);
  rpc ClientStream(stream SimpleRequest) returns (SimpleResponse);
  rpc Chat(stream SimpleRequest) returns (stream SimpleResponse);
  rpc Metadata(MetadataRequest) returns (SimpleResponse);
}

